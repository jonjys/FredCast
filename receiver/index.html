<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FredCast Receiver</title>
<style>
  :root {
    --bg: #0B0B10;
    --text: #F3F1EE;
    --text-dim: #9B98A6;
    --accent: #7C6FEE;
    --ready: #35D28A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #stage img, #stage video {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  #placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; text-align: center; padding: 40px;
  }
  #logo { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  #qrWrap {
    background: #fff; padding: 16px; border-radius: 18px; line-height: 0;
  }
  #qrWrap svg { width: 200px; height: 200px; display: block; }
  #code {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 1.6rem; letter-spacing: 0.15em; font-weight: 700;
    color: var(--text-dim);
  }
  #hint { color: var(--text-dim); font-size: 1.05rem; max-width: 34ch; }
  #status {
    position: fixed; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px;
    font-size: 0.85rem; color: var(--text-dim);
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  #status .dot.on { background: var(--ready); }
  #filename {
    position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    color: var(--text-dim); font-size: 0.9rem;
  }
  #liveBadge {
    position: fixed; top: 20px; left: 24px; display: none; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; color: #fff;
    background: #e0393e; padding: 5px 10px 5px 8px; border-radius: 999px;
  }
  #liveBadge .liveDot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  #liveBadge.on { display: flex; }
  #unmuteBtn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px; background: rgba(0,0,0,0.65);
    color: #fff; border: none; border-radius: 999px; padding: 10px 18px; font-size: 0.85rem;
  }
  #unmuteBtn.show { display: flex; }
</style>
</head>
<body>
  <div id="status"><span class="dot" id="statusDot"></span><span id="statusText">Ansluter…</span></div>
  <div id="stage">
    <div id="placeholder">
      <div id="logo">FredCast Receiver</div>
      <div id="qrWrap"></div>
      <div id="code">------</div>
      <div id="hint">Skanna QR-koden med kameran på din telefon — eller öppna FredCast och skriv in koden ovan</div>
    </div>
  </div>
  <div id="filename"></div>
  <div id="liveBadge"><span class="liveDot"></span>LIVE</div>
  <button id="unmuteBtn">🔇 Tryck för ljud</button>

  <script src="./vendor/qrcode.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const relayUrl = params.get('relay') || 'wss://fredcast-relay.onrender.com/ws';
    const appUrl = params.get('appUrl') || 'https://fred-cast.vercel.app';

    const codeEl = document.getElementById('code');
    const qrWrapEl = document.getElementById('qrWrap');
    const stageEl = document.getElementById('stage');
    const placeholderEl = document.getElementById('placeholder');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const filenameEl = document.getElementById('filename');
    const liveBadgeEl = document.getElementById('liveBadge');
    const unmuteBtnEl = document.getElementById('unmuteBtn');

    let ws;
    let code = params.get('code');
    let pc = null;
    let pendingIce = [];
    let remoteReady = false;

    const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function stopLiveStream() {
      if (pc) {
        try { pc.close(); } catch (e) {}
        pc = null;
      }
      pendingIce = [];
      remoteReady = false;
      liveBadgeEl.classList.remove('on');
      unmuteBtnEl.classList.remove('show');
      stageEl.querySelectorAll('video').forEach((el) => el.remove());
      placeholderEl.style.display = 'flex';
    }

    async function handleOffer(sdp) {
      stageEl.querySelectorAll('img, video, iframe').forEach((el) => el.remove());
      placeholderEl.style.display = 'none';
      filenameEl.textContent = '';

      pc = new RTCPeerConnection(RTC_CONFIG);
      let liveVideoEl = null;

      pc.ontrack = (event) => {
        if (!liveVideoEl) {
          liveVideoEl = document.createElement('video');
          liveVideoEl.autoplay = true;
          liveVideoEl.playsInline = true;
          liveVideoEl.muted = true;
          stageEl.appendChild(liveVideoEl);
          liveBadgeEl.classList.add('on');
          unmuteBtnEl.classList.add('show');
          unmuteBtnEl.onclick = () => {
            liveVideoEl.muted = false;
            unmuteBtnEl.classList.remove('show');
          };
        }
        liveVideoEl.srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'webrtc-ice', candidate: event.candidate }));
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc && (pc.connectionState === 'closed' || pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) {
          stopLiveStream();
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      remoteReady = true;
      for (const c of pendingIce) {
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
      }
      pendingIce = [];
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'webrtc-answer', sdp: pc.localDescription }));
    }

    function renderQr(pairUrl) {
      const qr = qrcode(0, 'M');
      qr.addData(pairUrl);
      qr.make();
      qrWrapEl.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 4 });
    }

    async function ensureCode() {
      if (code) return code;
      const httpBase = relayUrl.replace('wss://', 'https://').replace('ws://', 'http://').replace('/ws', '');
      const res = await fetch(httpBase + '/new-code');
      const data = await res.json();
      return data.code;
    }

    function youtubeId(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0] || null;
        if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
      } catch (e) {}
      return null;
    }

    function renderMedia(item) {
      stageEl.querySelectorAll('img, video, iframe').forEach((el) => el.remove());
      stopLiveStream();
      placeholderEl.style.display = 'none';
      filenameEl.textContent = item.name || '';

      const yt = item.uri && youtubeId(item.uri);
      if (yt) {
        const iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube.com/embed/' + yt + '?autoplay=1&rel=0';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.style.cssText = 'width:100%;height:100%;border:0;';
        stageEl.appendChild(iframe);
        return;
      }

      if (item.kind === 'video' || (item.uri && /\.(mp4|webm|ogg)(\?|$)/i.test(item.uri))) {
        const video = document.createElement('video');
        video.src = item.uri;
        video.autoplay = true;
        video.controls = true;
        video.style.cssText = 'max-width:100%;max-height:100%;';
        stageEl.appendChild(video);
      } else if (item.kind === 'link' || (item.uri && /^https?:\/\//i.test(item.uri) && !item.uri.startsWith('data:'))) {
        const iframe = document.createElement('iframe');
        iframe.src = item.uri;
        iframe.style.cssText = 'width:100%;height:100%;border:0;background:#fff;';
        stageEl.appendChild(iframe);
      } else {
        const img = document.createElement('img');
        img.src = item.uri;
        stageEl.appendChild(img);
      }
    }

    function connect() {
      ws = new WebSocket(relayUrl);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', code, role: 'receiver' }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'joined') {
          codeEl.textContent = msg.code.slice(0, 3) + ' ' + msg.code.slice(3);
          const pairUrl = `${appUrl}/?connectCode=${msg.code}`;
          renderQr(pairUrl);
        }

        if (msg.type === 'peer-status') {
          statusDot.classList.toggle('on', msg.connected);
          statusText.textContent = msg.connected ? 'Telefon ansluten' : 'Väntar på telefon…';
        }

        if (msg.type === 'media') {
          renderMedia(msg.item);
        }

        if (msg.type === 'control') {
          const video = stageEl.querySelector('video');
          if (msg.command === 'stop-live') {
            stopLiveStream();
            return;
          }
          if (!video) return;
          if (msg.command === 'play') video.play();
          if (msg.command === 'pause') video.pause();
        }

        if (msg.type === 'webrtc-offer') {
          handleOffer(msg.sdp);
        }

        if (msg.type === 'webrtc-ice' && msg.candidate) {
          if (!pc || !remoteReady) {
            pendingIce.push(msg.candidate);
          } else {
            pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
          }
        }
      };

      ws.onclose = () => {
        statusDot.classList.remove('on');
        statusText.textContent = 'Frånkopplad — återansluter…';
        stopLiveStream();
        setTimeout(connect, 1500);
      };

      ws.onerror = () => ws.close();
    }

    ensureCode().then((c) => {
      code = c;
      codeEl.textContent = c.slice(0, 3) + ' ' + c.slice(3);
      renderQr(`${appUrl}/?connectCode=${c}`);
      connect();
    });
  </script>
</body>
</html>
